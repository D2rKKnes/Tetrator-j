name: test Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: self-hosted
    env:
      ANDROID_HOME: "E:/sdk"
      ANDROID_SDK_ROOT: "E:/sdk"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Add d8 to PATH
        shell: cmd
        run: echo E:\sdk\build-tools\35.0.0>>%GITHUB_PATH%

      - name: Build with Gradle
        shell: cmd
        run: gradlew.bat deploy

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnzipMeImNotAModModIsJarInsideMe
          path: build/libs/*.jar
